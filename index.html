/* Design system: Awesomic — zinc neutrals, hairline borders, generous radii */
:root {
  --color-obsidian: #09090b; --color-graphite: #18181b; --color-slate: #27272a; --color-iron: #3f3f46;
  --color-steel: #52525b; --color-fog: #71717a; --color-ash: #a1a1aa; --color-mist: #d4d4d8;
  --color-cloud: #ececee; --color-paper: #f4f4f5; --color-snow: #ffffff; --color-ember: #ff5a00;
  --surface-subtle: #fafafa;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --radius-cards: 36px; --radius-buttons: 14px; --radius-badges: 12px;
  --shadow-md: rgba(0, 0, 0, 0.04) 0px 4px 12px 0px;
  --shadow-primary: inset 0 0.5px 0 0 rgba(255,255,255,.5), inset 0 9px 14px -5px rgba(117,123,133,.4), 0 0 0 1.5px rgb(44,46,52), 0 4px 6px 0 rgba(0,0,0,.14);
  --sheet: #fdfdfc;
  --grid: #e9e9ec;
  --ink: var(--color-graphite);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font: 400 15px/1.45 var(--font); color: var(--color-graphite); background: var(--color-paper); }
.app {
  /* page height: 76% of the window, but never so wide that page + gap + panel overflow */
  --gap: 56px; --pw: 280px; --ratio: 1.36;
  --H: max(440px, min(76vh, calc((100vw - 64px - var(--gap) - var(--pw)) / var(--ratio))));
  display: flex; justify-content: center; align-items: center; gap: var(--gap); min-height: 100vh; padding: 32px;
}

/* ------------------------------------------------------------ the page (checked paper) */
.desk { display: block; }
.page {
  --lh: 38px; --g: 19px;               /* grid square = half a line, so every other line is a writing line */
  position: relative; height: var(--H); width: calc(var(--H) * var(--ratio));
  display: flex; flex-direction: column; padding: 48px 56px 48px;
  border-radius: 32px; border: 1px solid var(--color-cloud); box-shadow: var(--shadow-md);
  background-color: var(--sheet);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--g) var(--g); background-position: var(--gx, 0) var(--gy, 0);
}
.text {
  flex: 1; min-height: 0; overflow: hidden;
  font-size: var(--fs); line-height: var(--lh); color: var(--ink); outline: none; white-space: pre-wrap; overflow-wrap: break-word;
  caret-color: var(--color-ember); font-family: var(--hand), var(--font);
}
.text:empty::before { content: attr(data-placeholder); color: var(--color-ash); pointer-events: none; }
.page { --fs: 28px; --hand: "Shii"; }

/* ------------------------------------------------------------ items */
.layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.item { position: absolute; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
        transform: translate(-50%, -50%) rotate(var(--rot, 0deg)); }
.item.dragging { cursor: grabbing; }
.item img { display: block; width: 100%; pointer-events: none; -webkit-user-drag: none; }
.item.pop > :first-child { animation: pop .32s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.45); } to { transform: scale(1); } }

.sticker img {   /* die-cut white border */
  filter: drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff)
          drop-shadow(0 5px 6px rgba(9,9,11,.18));
}

.photo .pic { background: var(--color-snow); padding: 3.5%; box-shadow: 0 1px 2px rgba(9,9,11,.1), 0 10px 20px -10px rgba(9,9,11,.32); }
.photo .pic img { aspect-ratio: var(--ar); object-fit: cover; }
.holder { cursor: pointer; }
.holder.swap { animation: swap .28s cubic-bezier(.3,1.6,.5,1); }
@keyframes swap { from { scale: .6; } to { scale: 1; } }
.clip { position: absolute; width: 13%; left: 50%; top: -10%; z-index: 1; transform: rotate(4deg); }
.clip svg { width: 100%; display: block; overflow: visible; }
.tape {
  position: absolute; width: 36%; aspect-ratio: 3.3; opacity: .88; mix-blend-mode: multiply; background-color: var(--tape);
  background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.38) 0 5px, transparent 5px 11px);
  clip-path: polygon(3% 0, 97% 0, 100% 18%, 96.5% 36%, 100% 54%, 96.5% 72%, 100% 90%, 97% 100%, 3% 100%, 0 82%, 3.5% 64%, 0 46%, 3.5% 28%, 0 10%);
}
.tape.plain { background-image: none; }
.tape.l { top: -4%; left: -12%; transform: rotate(-35deg); }
.tape.r { top: -4%; right: -12%; transform: rotate(35deg); }

.note .paper { background: #efeff0; padding: 14px 20px 16px; color: var(--ink); clip-path: var(--torn); }
.note .t { font-family: var(--hand), var(--font); font-size: calc(var(--fs) * .78); line-height: 1.3; outline: none;
           white-space: pre-wrap; overflow-wrap: break-word; min-height: 1.3em; }
.note.editing, .note.editing .t { cursor: text; user-select: text; -webkit-user-select: text; }
.note .t:empty::before { content: "Write a note…"; color: var(--color-ash); }

.item.sel { outline: 1px dashed var(--color-ash); outline-offset: 8px; border-radius: 6px; }
.ctl { position: absolute; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--color-cloud); background: var(--color-snow);
       color: var(--color-iron); display: none; place-items: center; cursor: pointer; padding: 0; z-index: 2; }
.item.sel .ctl { display: grid; }
.ctl.del { top: -21px; right: -21px; }
.ctl.del:hover { background: var(--color-obsidian); border-color: var(--color-obsidian); color: #fff; }
.ctl.turn { bottom: -21px; right: -21px; cursor: nwse-resize; }
.ctl svg { width: 13px; height: 13px; }

.drop-hint { position: absolute; inset: 10px; border: 1.5px dashed var(--color-ash); border-radius: 18px; background: rgba(244,244,245,.7);
             display: none; place-items: center; z-index: 5; font-weight: 500; color: var(--color-iron); pointer-events: none; }
.page.over .drop-hint { display: grid; }

/* ------------------------------------------------------------ side panel */
.panel {
  width: var(--pw); height: var(--H); overflow-y: auto; scrollbar-width: none; background: var(--color-snow); border: 1px solid var(--color-cloud);
  border-radius: 32px; padding: 24px; display: flex; flex-direction: column; gap: 20px;
}
.brand { display: flex; align-items: center; justify-content: space-between; }
.panel section + section { margin-top: 14px; }   /* more air between Text / Stickers / Add */
.bottom { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-top: 10px; border-top: 1px solid var(--color-cloud); }
.sm { font: 400 12px/1 var(--font); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 10px;
      border-radius: 12px; border: 1px solid var(--color-cloud); background: var(--color-snow); color: var(--color-iron); cursor: pointer; }
.sm:hover { border-color: var(--color-mist); color: var(--color-obsidian); }
.sm svg { width: 13px; height: 13px; }
.brand .logo { font-family: "Shii"; font-size: 34px; line-height: 1; color: var(--color-obsidian); white-space: nowrap; }
.brand .logo small { font-size: 17px; color: var(--color-fog); margin-left: 5px; }
.plus { width: 36px; height: 36px; border-radius: var(--radius-buttons); border: 1px solid var(--color-cloud); background: var(--surface-subtle);
        color: var(--color-graphite); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .15s, color .15s, border-color .15s; }
.plus:hover { background: var(--color-obsidian); border-color: var(--color-obsidian); color: #fff; }
.plus svg { width: 16px; height: 16px; }
.tools { display: flex; gap: 8px; position: relative; }
.lbl { display: block; font-size: 12px; line-height: 1.64; color: var(--color-fog); margin-bottom: 6px; }

.sliders { display: flex; flex-direction: column; gap: 10px; }
.sl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--color-graphite); }
.sl output { font-size: 12px; color: var(--color-fog); font-variant-numeric: tabular-nums; }
.sl input { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--color-obsidian); height: 18px; }

.stickers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.stickers button {
  aspect-ratio: 1; border: 1px solid var(--color-cloud); background: var(--surface-subtle); border-radius: var(--radius-buttons);
  padding: 5px; border-radius: 10px; cursor: grab; transition: border-color .15s, background .15s, transform .15s;
}
.stickers button:hover { border-color: var(--color-mist); background: var(--color-snow); transform: translateY(-2px) rotate(-4deg); }
.stickers img { width: 100%; height: 100%; display: block; pointer-events: none;
  filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 2px 3px rgba(9,9,11,.14)); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { font: 400 14px/1 var(--font); border-radius: var(--radius-buttons); padding: 13px 16px; cursor: pointer; border: 0;
       display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--color-obsidian); color: #fff; box-shadow: var(--shadow-primary); }
.btn.primary:hover { background: var(--color-slate); }
.btn.neutral { background: var(--surface-subtle); color: var(--color-graphite); box-shadow: inset 0 0 0 1px var(--color-cloud); }
.btn.neutral:hover { background: var(--color-paper); }
.hint { font-size: 12px; line-height: 1.64; color: var(--color-fog); margin: 8px 0 0; }

.panel footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--color-cloud); }
.panel footer p { margin: 0; font-size: 12px; line-height: 1.64; color: var(--color-fog); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); background: var(--color-obsidian); color: #fff;
         padding: 10px 16px; border-radius: var(--radius-buttons); font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {   /* stack: page on top, panel below */
  .app { flex-direction: column; align-items: stretch; padding: 16px; gap: 16px; }
  .page { width: 100%; height: auto; aspect-ratio: 1.36; }
  .panel { width: 100%; height: auto; }
}
@media (max-width: 640px) {
  .page { padding: 36px 22px 32px; }
}

<body>
<div class="app">
  <main class="desk">
    <div class="page" id="page">
      <div class="text" id="text" contenteditable="plaintext-only" spellcheck="false" data-placeholder="Hey you..."></div>
      <div class="layer" id="layer"></div>
      <div class="drop-hint">Drop to add it to the page</div>
    </div>
  </main>

  <aside class="panel">
    <div class="brand">
      <span class="logo">Khat<small>by shii</small></span>
    </div>

    <section>
      <span class="lbl">Text</span>
      <div class="sliders">
        <label class="sl"><span>Size</span><output id="o_size"></output><input type="range" id="size" min="18" max="44" step="1"></label>
        <label class="sl"><span>Letter spacing</span><output id="o_ls"></output><input type="range" id="ls" min="-6" max="16" step="1"></label>
        <label class="sl"><span>Line height</span><output id="o_lh"></output><input type="range" id="lh" min="28" max="64" step="2"></label>
      </div>
    </section>

    <section>
      <span class="lbl">Stickers</span>
      <div class="stickers" id="stickers"></div>
    </section>

    <section>
      <span class="lbl">Add to the page</span>
      <div class="actions">
        <button class="btn neutral" id="photoBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2"/><path d="m21 16-5-5-8 9"/></svg>Photo
        </button>
        <button class="btn neutral" id="noteBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 20 4l-.5 13L4 19.5z"/><path d="M8 10h8M8 14h5"/></svg>Note
        </button>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </section>

    <div class="bottom">
      <button class="sm" id="saveBtn" title="Download image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg>Download
      </button>
      <button class="sm" id="clear" title="Restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>Restart
      </button>
    </div>

  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------- illustrated stickers
const O = (w = 3.2) => `stroke="#3d3030" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const face = (cx, cy, s = 1) => `
  <circle cx="${cx - 9 * s}" cy="${cy}" r="${2.6 * s}" fill="#3d3030"/><circle cx="${cx + 9 * s}" cy="${cy}" r="${2.6 * s}" fill="#3d3030"/>
  <path d="M${cx - 4 * s} ${cy + 5 * s} q${4 * s} ${4 * s} ${8 * s} 0" fill="none" stroke="#3d3030" stroke-width="${2.4 * s}" stroke-linecap="round"/>
  <ellipse cx="${cx - 15 * s}" cy="${cy + 6 * s}" rx="${4 * s}" ry="${2.4 * s}" fill="#ff9fb8" opacity=".75"/>
  <ellipse cx="${cx + 15 * s}" cy="${cy + 6 * s}" rx="${4 * s}" ry="${2.4 * s}" fill="#ff9fb8" opacity=".75"/>`;
const STICKERS = {
  heart: `<path d="M50 86C22 66 10 50 12 34c2-14 14-22 26-19 6 2 10 6 12 11 2-5 6-9 12-11 12-3 24 5 26 19 2 16-10 32-38 52z" fill="#ff7fa3" ${O()}/>
          <path d="M26 30c2-6 8-9 13-8" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>`,
  star: `<path d="M50 9l11.5 23.5 26 3.8-18.8 18.3 4.4 25.9L50 68.3 26.9 80.5l4.4-25.9L12.5 36.3l26-3.8z" fill="#ffd45e" ${O()}/>${face(50, 46, .8)}`,
  flower: `${[0, 72, 144, 216, 288].map(a => `<ellipse cx="50" cy="27" rx="15" ry="19" fill="#ffc2d6" ${O()} transform="rotate(${a} 50 50)"/>`).join("")}
           <circle cx="50" cy="50" r="15" fill="#ffd45e" ${O()}/><circle cx="45" cy="45" r="3.5" fill="#fff" opacity=".8"/>`,
  smiley: `<circle cx="50" cy="50" r="37" fill="#ffd45e" ${O()}/>${face(50, 46, 1.15)}`,
  sparkle: `<path d="M50 8c4 24 10 34 34 42-24 8-30 18-34 42-4-24-10-34-34-42 24-8 30-18 34-42z" fill="#b9a4f5" ${O()}/>
            <path d="M80 12c1.5 7 3.5 9.5 10 11-6.5 1.5-8.5 4-10 11-1.5-7-3.5-9.5-10-11 6.5-1.5 8.5-4 10-11z" fill="#ffd45e" ${O(2.4)}/>`,
  cloud: `<path d="M27 74c-11 0-18-8-17-17 1-8 8-14 16-13 2-12 12-20 24-19 10 1 18 8 20 17 9-1 18 6 18 16s-8 16-17 16z" fill="#bfe3ff" ${O()}/>${face(51, 56, .9)}`,
  rainbow: `<path d="M10 74a40 40 0 0 1 80 0" fill="none" stroke="#3d3030" stroke-width="20" stroke-linecap="round"/>
            <path d="M10 74a40 40 0 0 1 80 0" fill="none" stroke="#ff8fa8" stroke-width="13.5" stroke-linecap="round"/>
            <path d="M23 74a27 27 0 0 1 54 0" fill="none" stroke="#3d3030" stroke-width="16" stroke-linecap="round"/>
            <path d="M23 74a27 27 0 0 1 54 0" fill="none" stroke="#ffd45e" stroke-width="10" stroke-linecap="round"/>
            <path d="M35 74a15 15 0 0 1 30 0" fill="none" stroke="#3d3030" stroke-width="13" stroke-linecap="round"/>
            <path d="M35 74a15 15 0 0 1 30 0" fill="none" stroke="#8fd9b6" stroke-width="7" stroke-linecap="round"/>`,
  cherry: `<path d="M34 62C40 40 48 26 66 14M66 62c-2-20-2-34 0-48" fill="none" stroke="#3d3030" stroke-width="4" stroke-linecap="round"/>
           <path d="M66 14c8-8 20-6 24 0-8 6-18 6-24 0z" fill="#8fd9b6" ${O()}/>
           <circle cx="32" cy="70" r="16" fill="#ff5f7e" ${O()}/><circle cx="68" cy="70" r="16" fill="#ff5f7e" ${O()}/>
           <circle cx="26" cy="64" r="4" fill="#fff" opacity=".8"/><circle cx="62" cy="64" r="4" fill="#fff" opacity=".8"/>`,
  moon: `<path d="M64 12A40 40 0 1 0 88 66 32 32 0 0 1 64 12z" fill="#d6c2f7" ${O()}/>
         <circle cx="34" cy="52" r="2.6" fill="#3d3030"/><circle cx="50" cy="56" r="2.6" fill="#3d3030"/>
         <path d="M38 62q4 4 8 0" fill="none" stroke="#3d3030" stroke-width="2.4" stroke-linecap="round"/>`,
  bow: `<path d="M50 50C36 30 16 26 12 36s2 30 38 14zM50 50c14-20 34-24 38-14s-2 30-38 14z" fill="#ff9fbd" ${O()}/>
        <path d="M44 54l-12 30 10-4 6 8 2-32M56 54l12 30-10-4-6 8-2-32" fill="#ff9fbd" ${O()}/>
        <rect x="42" y="42" width="16" height="16" rx="6" fill="#ff7fa3" ${O()}/>`,
  letter: `<rect x="12" y="24" width="76" height="54" rx="6" fill="#fff4dc" ${O()}/>
           <path d="M14 28l36 28 36-28" fill="none" ${O()}/>
           <path d="M50 70c-9-6-13-10-12-15 1-4 6-6 9-3l3 3 3-3c3-3 8-1 9 3 1 5-3 9-12 15z" fill="#ff7fa3" ${O(2.6)}/>`,
  hearts: `<path d="M38 78C18 64 10 53 12 42c1-9 10-14 17-12 4 1 7 4 9 7 2-3 5-6 9-7 8-2 16 3 17 12 1 11-7 22-26 36z" fill="#ff7fa3" ${O()}/>
           <path d="M72 44C60 36 56 30 57 24c1-5 6-8 10-7 2 1 4 2 5 4 1-2 3-3 5-4 4-1 9 2 10 7 1 6-4 12-15 20z" fill="#ffc2d6" ${O(2.8)}/>`,
};
const svgURI = k => "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${STICKERS[k]}</svg>`);

// what holds a photo down — click it to cycle to the next one
const HOLDERS = [
  { kind: "clip" },
  { kind: "tape", color: "#f6b7c8" },
  { kind: "tape", color: "#a9dcc7" },
  { kind: "tape", color: "#f7d98b" },
  { kind: "tape", color: "#c3b6ef" },
  { kind: "tape", color: "#d4d4d8", plain: true },
];
const CLIP = `<svg viewBox="0 0 30 90" fill="none" stroke="#71717a" stroke-width="2.6" stroke-linecap="round"><path d="M9 30V12a6 6 0 0 1 12 0v52a10 10 0 0 1-20 0V22"/><path d="M15 22v40" stroke="#a1a1aa"/></svg>`;
function holderHTML(i) {
  const h = HOLDERS[i % HOLDERS.length];
  if (h.kind === "clip") return `<div class="clip holder" title="Click to change">${CLIP}</div>`;
  const t = `class="tape holder${h.plain ? " plain" : ""}" style="--tape:${h.color}" title="Click to change"`;
  return `<i ${t.replace('class="tape', 'class="tape l')}></i><i ${t.replace('class="tape', 'class="tape r')}></i>`;
}

// ---------------------------------------------------------------- state
const $ = id => document.getElementById(id);
const page = $("page"), layer = $("layer"), text = $("text");
const KEY = "shii-diary-v3";
let S = load(), selected = null;

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.items) return s; } catch (e) {}
  return { text: "", items: [] };
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { if (e && (e.name === "QuotaExceededError" || e.code === 22)) toast("This page is too big to remember — try fewer or smaller photos."); }
  }, 250);
}
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200); }
function tornClip() {
  const p = [], n = 9;
  for (let i = 0; i <= n; i++) p.push(`${(i / n * 100).toFixed(1)}% ${(Math.random() * 7).toFixed(1)}%`);
  for (let i = 1; i <= 4; i++) p.push(`${(97 + Math.random() * 3).toFixed(1)}% ${(i * 25).toFixed(0)}%`);
  for (let i = n; i >= 0; i--) p.push(`${(i / n * 100).toFixed(1)}% ${(93 + Math.random() * 7).toFixed(1)}%`);
  for (let i = 3; i >= 1; i--) p.push(`${(Math.random() * 3).toFixed(1)}% ${(i * 25).toFixed(0)}%`);
  return `polygon(${p.join(",")})`;
}

// ---------------------------------------------------------------- writing
// Line the grid up so a horizontal grid line runs exactly under every line of text.
function alignGrid() {
  const cs = getComputedStyle(text), p = document.createElement("div");
  p.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font:${cs.font};line-height:${cs.lineHeight}`;
  p.innerHTML = 'Hx<span style="display:inline-block;width:1px;height:0"></span>';
  document.body.appendChild(p);
  const base = p.lastChild.getBoundingClientRect().top - p.getBoundingClientRect().top; p.remove();
  const g = parseFloat(getComputedStyle(page).getPropertyValue("--g"));
  const y = text.offsetTop + base - 0.5, x = text.offsetLeft;
  page.style.setProperty("--gy", (((y % g) + g) % g) + "px");
  page.style.setProperty("--gx", (x % g) + "px");
}
// text size, letter spacing (1/100 em) and line height (px; the grid square is half a line)
const TEXT_DEFAULTS = { size: 28, ls: 0, lh: 38 };
function applyText() {
  const t = { ...TEXT_DEFAULTS, ...(S.textStyle || {}) };
  page.style.setProperty("--fs", t.size + "px");
  page.style.setProperty("--lh", t.lh + "px");
  page.style.setProperty("--g", t.lh / 2 + "px");
  text.style.letterSpacing = t.ls / 100 + "em";
  for (const k of ["size", "ls", "lh"]) $(k).value = t[k];
  $("o_size").textContent = t.size + "px";
  $("o_ls").textContent = (t.ls > 0 ? "+" : "") + t.ls;
  $("o_lh").textContent = (t.lh / t.size).toFixed(2) + "×";
  alignGrid();
}
for (const k of ["size", "ls", "lh"]) $(k).addEventListener("input", e => {
  S.textStyle = { ...TEXT_DEFAULTS, ...(S.textStyle || {}), [k]: +e.target.value }; save(); applyText();
  if (text.scrollHeight > text.clientHeight + 2) toast("Some of your writing doesn't fit at this setting.");
});
text.textContent = S.text;
let lastFit = S.text;
text.addEventListener("input", () => {
  if (text.scrollHeight > text.clientHeight + 2) {          // the page is full, like real paper
    text.textContent = lastFit;
    const r = document.createRange(); r.selectNodeContents(text); r.collapse(false);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast("This page is full — press restart for a fresh page.");
    return;
  }
  lastFit = S.text = text.innerText.replace(/\n$/, ""); save();
});
document.addEventListener("paste", e => {
  if (!e.target.isContentEditable) return;
  e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text"));
});

// ---------------------------------------------------------------- items
// positions are in units of page width so they survive resizing
const W = () => page.clientWidth;
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const ICON_TURN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>';

function place(el, it) {
  el.style.left = it.x * W() + "px"; el.style.top = it.y * W() + "px";
  el.style.width = it.w * W() + "px"; el.style.setProperty("--rot", it.r + "deg"); el.style.zIndex = it.z;
}
function build(it, fresh) {
  const el = document.createElement("div");
  el.className = `item ${it.type}${fresh ? " pop" : ""}`; el.dataset.id = it.id;
  if (it.type === "sticker") el.innerHTML = `<img alt="" src="${svgURI(it.key)}">`;
  if (it.type === "photo") el.innerHTML = `<div class="pic"><img alt="" src="${it.src}" style="--ar:${it.ar}"></div>${holderHTML(it.holder)}`;
  if (it.type === "note") {
    el.innerHTML = `<div class="paper" style="--torn:${it.torn}"><div class="t" spellcheck="false"></div></div>`;
    const t = el.querySelector(".t"); t.textContent = it.text || "";
    t.addEventListener("input", () => { it.text = t.innerText.replace(/\n$/, ""); save(); });
    t.addEventListener("blur", () => { t.contentEditable = "false"; el.classList.remove("editing"); });
    el.addEventListener("dblclick", () => editNote(el));
  }
  el.insertAdjacentHTML("beforeend", `<button class="ctl del" title="Remove">${ICON_X}</button><button class="ctl turn" title="Turn &amp; resize">${ICON_TURN}</button>`);
  place(el, it); layer.appendChild(el); wireItem(el, it);
  return el;
}
function cycleHolder(el, it) {
  it.holder = ((it.holder || 0) + 1) % HOLDERS.length;
  el.querySelectorAll(".holder").forEach(h => h.remove());
  el.querySelector(".pic").insertAdjacentHTML("afterend", holderHTML(it.holder));
  el.querySelectorAll(".holder").forEach(h => h.classList.add("swap"));
  save();
}
function editNote(el) {
  const t = el.querySelector(".t"); el.classList.add("editing"); t.contentEditable = "plaintext-only"; t.focus();
  const r = document.createRange(); r.selectNodeContents(t); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
const topZ = () => Math.max(10, ...S.items.map(i => i.z)) + 1;
function add(it) { it.id = Math.random().toString(36).slice(2, 9); it.z = topZ(); S.items.push(it); const el = build(it, true); select(el); save(); return el; }
function remove(id) { S.items = S.items.filter(i => i.id !== id); layer.querySelector(`[data-id="${id}"]`)?.remove(); selected = null; save(); }
function select(el) {
  layer.querySelectorAll(".item.sel").forEach(e => e.classList.remove("sel"));
  selected = el ? el.dataset.id : null; if (el) el.classList.add("sel");
}
function spot() {   // somewhere in the visible part of the page
  const r = page.getBoundingClientRect(), w = W();
  const vy = Math.min(Math.max(window.innerHeight / 2 - r.top, 120), r.height - 120);
  return { x: 0.2 + Math.random() * 0.6, y: (vy + (Math.random() - .5) * 200) / w };
}

function wireItem(el, it) {
  el.addEventListener("pointerdown", e => {
    if (e.target.closest(".del") || el.classList.contains("editing")) return;
    e.preventDefault(); e.stopPropagation();
    it.z = topZ(); el.style.zIndex = it.z; select(el);
    const pr = page.getBoundingClientRect(), w = W();
    el.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY, onHolder = !!e.target.closest(".holder");
    let moved = false;
    if (e.target.closest(".turn")) {
      const cx = pr.left + it.x * w, cy = pr.top + it.y * w;
      const a0 = Math.atan2(e.clientY - cy, e.clientX - cx), d0 = Math.hypot(e.clientX - cx, e.clientY - cy), r0 = it.r, w0 = it.w;
      el.onpointermove = m => {
        const a = Math.atan2(m.clientY - cy, m.clientX - cx), d = Math.hypot(m.clientX - cx, m.clientY - cy);
        it.r = r0 + (a - a0) * 180 / Math.PI; it.w = Math.min(0.8, Math.max(0.04, w0 * d / d0)); place(el, it);
      };
    } else {
      const ox = e.clientX - (pr.left + it.x * w), oy = e.clientY - (pr.top + it.y * w);
      el.onpointermove = m => {
        if (!moved && Math.hypot(m.clientX - sx, m.clientY - sy) < 4) return;   // tiny wobble = a click
        moved = true; el.classList.add("dragging");
        it.x = Math.min(1, Math.max(0, (m.clientX - ox - pr.left) / w));
        it.y = Math.min(page.clientHeight / w, Math.max(0, (m.clientY - oy - pr.top) / w)); place(el, it);
      };
    }
    el.onpointerup = el.onpointercancel = ev => {
      el.onpointermove = null; el.classList.remove("dragging");
      if (ev.type === "pointerup" && onHolder && !moved) cycleHolder(el, it);
      save();
    };
  });
  el.querySelector(".del").addEventListener("click", e => { e.stopPropagation(); remove(it.id); });
}

// ---------------------------------------------------------------- sticker tray
const tray = $("stickers");
for (const k of Object.keys(STICKERS)) {
  const b = document.createElement("button");
  b.title = k; b.draggable = true; b.innerHTML = `<img alt="${k}" src="${svgURI(k)}">`;
  b.onclick = () => add({ type: "sticker", key: k, ...spot(), w: 0.12, r: Math.round(Math.random() * 24 - 12) });
  b.addEventListener("dragstart", e => { e.dataTransfer.setData("text/x-sticker", k); e.dataTransfer.effectAllowed = "copy"; });
  tray.appendChild(b);
}

// ---------------------------------------------------------------- photos & notes
function readPhoto(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => {
      const img = new Image(); img.onerror = rej;
      img.onload = () => {   // shrink big photos so the page stays light
        const k = Math.min(1, 1100 / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res({ src: c.toDataURL("image/jpeg", 0.85), ar: c.width / c.height });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function addPhotos(files, at) {
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    try {
      const p = await readPhoto(f);
      add({ type: "photo", ...p, ...(at || spot()), w: 0.32, r: Math.round(Math.random() * 10 - 5), holder: 0 });
      if (at) at = { x: at.x + 0.03, y: at.y + 0.03 };
    } catch (e) { toast("Couldn't open that image."); }
  }
}
$("photoBtn").onclick = () => $("file").click();
$("file").onchange = e => { addPhotos([...e.target.files]); e.target.value = ""; };
$("noteBtn").onclick = () => editNote(add({ type: "note", text: "", torn: tornClip(), ...spot(), w: 0.34, r: Math.round(Math.random() * 6 - 3) }));

page.addEventListener("dragover", e => { e.preventDefault(); if ([...e.dataTransfer.types].includes("Files")) page.classList.add("over"); });
page.addEventListener("dragleave", e => { if (!page.contains(e.relatedTarget)) page.classList.remove("over"); });
page.addEventListener("drop", e => {
  e.preventDefault(); page.classList.remove("over");
  const pr = page.getBoundingClientRect(), w = W(), at = { x: (e.clientX - pr.left) / w, y: (e.clientY - pr.top) / w };
  const k = e.dataTransfer.getData("text/x-sticker");
  if (k) add({ type: "sticker", key: k, ...at, w: 0.12, r: Math.round(Math.random() * 24 - 12) });
  else if (e.dataTransfer.files.length) addPhotos([...e.dataTransfer.files], at);
});

// ---------------------------------------------------------------- general
document.addEventListener("pointerdown", e => { if (!e.target.closest(".item")) select(null); });
document.addEventListener("keydown", e => {
  if (!selected || e.target.isContentEditable) return;
  if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); remove(selected); }
  if (e.key === "Escape") select(null);
});
window.addEventListener("resize", () => { alignGrid(); S.items.forEach(it => { const el = layer.querySelector(`[data-id="${it.id}"]`); if (el) place(el, it); }); });
$("clear").onclick = () => {
  if (!confirm("Restart? This clears the writing, stickers, photos and notes.")) return;
  S = { textStyle: S.textStyle, text: "", items: [] }; lastFit = ""; layer.innerHTML = ""; text.textContent = ""; save(); text.focus();
};

// ---------------------------------------------------------------- save as image / share
// Drawn from the page state (not a screenshot), so it's crisp and leaves out selection handles.
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const CLIP_URI = "data:image/svg+xml;utf8," + encodeURIComponent(CLIP.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" '));
const TAPE_POLY = [[3,0],[97,0],[100,18],[96.5,36],[100,54],[96.5,72],[100,90],[97,100],[3,100],[0,82],[3.5,64],[0,46],[3.5,28],[0,10]];
const SCALE = 2;

function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function polyPath(ctx, pts, w, h) { ctx.beginPath(); pts.forEach(([px, py], i) => ctx[i ? "lineTo" : "moveTo"](px / 100 * w, py / 100 * h)); ctx.closePath(); }
function lineBoxes(el, origin) {   // each wrapped line of an element's text, relative to origin
  const out = [], range = document.createRange(), tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = tw.nextNode())) {
    const s = n.textContent;
    for (let i = 0; i < s.length; i++) {
      if (s[i] === "\n") continue;
      range.setStart(n, i); range.setEnd(n, i + 1);
      const r = range.getClientRects()[0]; if (!r) continue;
      let L = out.find(l => Math.abs(l.top - r.top) < 3);
      if (!L) { L = { top: r.top, left: r.left, str: "" }; out.push(L); }
      L.str += s[i]; L.left = Math.min(L.left, r.left);
    }
  }
  return out.map(l => ({ str: l.str.replace(/\s+$/, ""), x: l.left - origin.left, top: l.top - origin.top }));
}
function drawLines(ctx, el, lines) {
  const cs = getComputedStyle(el);
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; ctx.fillStyle = cs.color; ctx.textBaseline = "alphabetic";
  if ("letterSpacing" in ctx) ctx.letterSpacing = cs.letterSpacing === "normal" ? "0px" : cs.letterSpacing;
  const asc = ctx.measureText("Hg").fontBoundingBoxAscent;
  lines.forEach(l => ctx.fillText(l.str, l.x, l.top + asc));
}
async function drawSticker(ctx, it, w) {
  const img = await loadImg(svgURI(it.key)), p = 6, k = SCALE;
  const sc = document.createElement("canvas"); sc.width = sc.height = Math.ceil((w + 2 * p) * k);
  const sx = sc.getContext("2d"); sx.scale(k, k); sx.drawImage(img, p, p, w, w);
  sx.globalCompositeOperation = "source-in"; sx.fillStyle = "#fff"; sx.fillRect(0, 0, w + 2 * p, w + 2 * p);
  ctx.save(); ctx.shadowColor = "rgba(9,9,11,.18)"; ctx.shadowBlur = 6 * k; ctx.shadowOffsetY = 5 * k;
  ctx.drawImage(sc, -p, -p, w + 2 * p, w + 2 * p); ctx.restore();
  for (let a = 0; a < 16; a++) { const t = a / 16 * Math.PI * 2; ctx.drawImage(sc, -p + 2.5 * Math.cos(t), -p + 2.5 * Math.sin(t), w + 2 * p, w + 2 * p); }
  ctx.drawImage(img, 0, 0, w, w);
}
function drawTape(ctx, color, plain, x, y, tw, rot) {
  const th = tw / 3.3;
  ctx.save(); ctx.translate(x + tw / 2, y + th / 2); ctx.rotate(rot * Math.PI / 180); ctx.translate(-tw / 2, -th / 2);
  polyPath(ctx, TAPE_POLY, tw, th); ctx.clip();
  ctx.globalAlpha = .88; ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = color; ctx.fillRect(0, 0, tw, th);
  if (!plain) {
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = .38; ctx.strokeStyle = "#fff"; ctx.lineWidth = 5 / Math.SQRT2 * 1.41;
    for (let d = -th; d < tw + th; d += 11 * Math.SQRT2) { ctx.beginPath(); ctx.moveTo(d, 0); ctx.lineTo(d + th, th); ctx.stroke(); }
  }
  ctx.restore();
}
async function drawPhoto(ctx, it, el, w, h) {
  const pad = 0.035 * w, img = el.querySelector(".pic img");
  ctx.save(); ctx.shadowColor = "rgba(9,9,11,.3)"; ctx.shadowBlur = 20 * SCALE; ctx.shadowOffsetY = 10 * SCALE;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.restore();
  ctx.drawImage(img, pad, pad, w - 2 * pad, h - 2 * pad);
  const hd = HOLDERS[(it.holder || 0) % HOLDERS.length];
  if (hd.kind === "clip") {
    const cw = 0.13 * w, clip = await loadImg(CLIP_URI);
    ctx.save(); ctx.translate(0.5 * w + cw / 2, -0.1 * h + cw * 1.5); ctx.rotate(4 * Math.PI / 180);
    ctx.drawImage(clip, -cw / 2, -cw * 1.5, cw, cw * 3); ctx.restore();
  } else {
    const tw = 0.36 * w;
    drawTape(ctx, hd.color, hd.plain, -0.12 * w, -0.04 * h, tw, -35);
    drawTape(ctx, hd.color, hd.plain, w - tw + 0.12 * w, -0.04 * h, tw, 35);
  }
}
function drawNote(ctx, it, el, w, h) {
  const pts = (it.torn.match(/[\d.]+% [\d.]+%/g) || []).map(s => s.split(" ").map(parseFloat));
  polyPath(ctx, pts, w, h); ctx.fillStyle = "#efeff0"; ctx.fill();
  const t = el.querySelector(".t"), rot = el.style.getPropertyValue("--rot");
  el.style.setProperty("--rot", "0deg");                  // measure the text unrotated
  const lines = lineBoxes(t, el.getBoundingClientRect());
  el.style.setProperty("--rot", rot);
  drawLines(ctx, t, lines);
}
async function renderPage() {
  select(null); await document.fonts.ready;
  const PW = page.offsetWidth, PH = page.offsetHeight, pr = page.getBoundingClientRect();
  const c = document.createElement("canvas"); c.width = PW * SCALE; c.height = PH * SCALE;
  const ctx = c.getContext("2d"); ctx.scale(SCALE, SCALE);
  ctx.save(); roundRect(ctx, 0, 0, PW, PH, 24); ctx.clip();
  ctx.fillStyle = "#fdfdfc"; ctx.fillRect(0, 0, PW, PH);
  const g = parseFloat(getComputedStyle(page).getPropertyValue("--g")) || 19;
  const gx = parseFloat(page.style.getPropertyValue("--gx")) || 0, gy = parseFloat(page.style.getPropertyValue("--gy")) || 0;
  ctx.fillStyle = "#e9e9ec";
  for (let x = 1 + ((gx % g) + g) % g - g; x < PW; x += g) ctx.fillRect(x, 0, 1, PH);
  for (let y = 1 + ((gy % g) + g) % g - g; y < PH; y += g) ctx.fillRect(0, y, PW, 1);
  drawLines(ctx, text, lineBoxes(text, pr));
  for (const it of [...S.items].sort((a, b) => a.z - b.z)) {
    const el = layer.querySelector(`[data-id="${it.id}"]`); if (!el) continue;
    const w = it.w * page.clientWidth, h = el.offsetHeight;
    ctx.save(); ctx.translate(1 + it.x * page.clientWidth, 1 + it.y * page.clientWidth); ctx.rotate(it.r * Math.PI / 180); ctx.translate(-w / 2, -h / 2);
    if (it.type === "sticker") await drawSticker(ctx, it, w);
    if (it.type === "photo") await drawPhoto(ctx, it, el, w, h);
    if (it.type === "note") drawNote(ctx, it, el, w, h);
    ctx.restore();
  }
  ctx.restore();
  ctx.strokeStyle = "#ececee"; ctx.lineWidth = 1; roundRect(ctx, .5, .5, PW - 1, PH - 1, 24); ctx.stroke();
  return c;
}
async function makeBlob(type) {
  let c = await renderPage();
  if (type === "image/jpeg") {   // JPEG has no transparency: put the page on the canvas grey
    const j = document.createElement("canvas"); j.width = c.width; j.height = c.height;
    const x = j.getContext("2d"); x.fillStyle = "#f4f4f5"; x.fillRect(0, 0, j.width, j.height); x.drawImage(c, 0, 0); c = j;
  }
  return new Promise((res, rej) => { try { c.toBlob(b => b ? res(b) : rej(new Error("empty")), type, 0.92); } catch (e) { rej(e); } });
}
const fileName = ext => `khat-${new Date().toISOString().slice(0, 10)}.${ext}`;
async function download(type, ext) {
  try {
    const b = await makeBlob(type), a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = fileName(ext); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast("Couldn't save the image — try another browser."); }
}
$("saveBtn").onclick = () => download("image/jpeg", "jpg");

applyText();
document.fonts.ready.then(() => { alignGrid(); S.items.forEach(it => build(it, false)); });
</script>
</body>
